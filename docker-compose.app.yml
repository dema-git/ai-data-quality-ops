services:
  api_app:
    build:
      context: .
      dockerfile: services/fastapi_app/Dockerfile
    ports:
      - "${API_APP_PORT}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_ENDPOINT: "minio:9010"
      OPERATIONAL_API_TOKEN: ${OPERATIONAL_API_TOKEN:-medallion-ops-token}
      GENERATOR_INTERVAL_SECONDS: ${GENERATOR_INTERVAL_SECONDS:-60}
      GENERATOR_SESSIONS_PER_BATCH: ${GENERATOR_SESSIONS_PER_BATCH:-2}
      GENERATOR_BAD_DATA_RATE: ${GENERATOR_BAD_DATA_RATE:-0.0}
      AI_INCIDENT_ANALYSIS_MODE: ${AI_INCIDENT_ANALYSIS_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_REQUEST_TIMEOUT_SECONDS: ${OPENAI_REQUEST_TIMEOUT_SECONDS:-30}
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./shared_logs:/shared/logs
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=3)\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
